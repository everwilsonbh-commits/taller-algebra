<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rompecabezas de áreas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: mesa de trabajo cuadriculada; tablero grande al centro, narración y expresión debajo. Verde = a², madera = ab, teja = b², como los recortables. */
:root{
  --paper:#f5f7f4; --grid:#e2e8e3; --card:#ffffff; --ink:#18252d; --ink-2:#4a5a62; --line:#cdd6d2;
  --suma:#1d7a60; --suma-soft:#d5ebe3; --mult:#c2432a; --mult-soft:#f7ddd4;
  --accent:#2747c9; --accent-soft:#dfe5fb; --stick:#a86f22;
  --ok:#1c7a3a; --ok-soft:#d8eedd; --bad:#b3261e; --bad-soft:#f6d9d6;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11181c; --grid:#1a242a; --card:#172127; --ink:#e8eeeb; --ink-2:#a8b6ba; --line:#2d3a41;
  --suma:#4cc59f; --suma-soft:#16362d; --mult:#ff7d5e; --mult-soft:#3d2018;
  --accent:#93a8ff; --accent-soft:#202b55; --stick:#dca452;
  --ok:#5fd07f; --ok-soft:#173523; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11181c; --grid:#1a242a; --card:#172127; --ink:#e8eeeb; --ink-2:#a8b6ba; --line:#2d3a41;
  --suma:#4cc59f; --suma-soft:#16362d; --mult:#ff7d5e; --mult-soft:#3d2018;
  --accent:#93a8ff; --accent-soft:#202b55; --stick:#dca452;
  --ok:#5fd07f; --ok-soft:#173523; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,3.2vw,2.4rem);font-weight:800}
h3{font-size:1.25rem;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1280px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand small{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.brand b{font-family:var(--display);font-size:1.2rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;max-width:1280px;margin:8px auto 0}
nav.tabs a{text-decoration:none;color:var(--ink-2);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.95rem;border:1px solid transparent}
nav.tabs a span{font-family:var(--mono);font-size:.75rem;opacity:.7;margin-left:4px}
nav.tabs a:hover{border-color:var(--line);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--card)}
.timer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.timer output{font-family:var(--mono);font-size:1.35rem;font-weight:700;min-width:4.2ch;text-align:right}
.timer.done output{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;min-width:38px;height:38px;padding:0 10px;cursor:pointer;font-weight:700}
.icon-btn:hover{border-color:var(--ink-2)}
.score-strip{display:flex;gap:6px;flex-wrap:wrap}
.score-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--card);cursor:pointer}
.score-chip b{font-family:var(--mono);background:var(--ink);color:var(--card);border-radius:999px;padding:0 9px;min-width:2.2em;text-align:center}
.score-chip .dot{width:10px;height:10px;border-radius:50%}

/* Vistas */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.view{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.eyebrow{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.lede{color:var(--ink-2);font-size:1.1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.quote{border-left:6px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.btn{border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.ghost{border-color:var(--line)}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card)}
label.slider{display:block;font-weight:700}
label.slider input{display:block;margin-top:4px}
label.slider span.v{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
input[type=text],input[type=number]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);min-width:0}
.big-num{font-family:var(--mono);font-weight:700;font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tag{align-self:flex-start;display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.tag.suma{background:var(--suma-soft);color:var(--suma)}
.tag.mult{background:var(--mult-soft);color:var(--mult)}
.callout{border-radius:10px;padding:12px 14px;background:var(--accent-soft)}
.callout.ok{background:var(--ok-soft)}
.callout.bad{background:var(--bad-soft)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
th{background:var(--paper);font-size:.9rem}
td.reveal{cursor:pointer;color:var(--ink-2)}
td.reveal:hover{background:var(--accent-soft)}

/* Inicio */
.offer{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.opt{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.opt.a{border-color:var(--suma);background:var(--suma-soft)}
.opt.b{border-color:var(--mult);background:var(--mult-soft)}
.opt h3{font-size:1.4rem}
.vote{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vote output{font-family:var(--mono);font-size:2rem;font-weight:700}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.bar .track{height:34px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.bar .fill{height:100%;transition:width .35s ease}
.bar .fill.a{background:var(--suma)}
.bar .fill.b{background:var(--mult)}
.bar .lbl{position:absolute;inset:0 10px;display:flex;align-items:center;font-family:var(--mono);font-weight:700;font-size:.95rem}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ladder li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2)}
.ladder li.passed{background:var(--ok-soft);color:var(--ink);border-color:transparent}
.ladder li.next{border:2px dashed var(--accent);color:var(--ink)}
.ladder li .m{font-family:var(--mono);font-size:.85rem}
.guesses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.guess{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:10px;border:1px solid var(--line)}
.guess.win{border:2px solid var(--ok);background:var(--ok-soft)}

/* Estaciones */
.fig-box{background:var(--paper);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:12px;min-height:220px;overflow:hidden}
.fig-box svg,.fig-box canvas{max-width:100%;height:auto}
.check-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check-row input{width:7rem}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:440px;width:100%;aspect-ratio:1}
.board button{border:0;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:0;position:relative}
.board button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:-3px;z-index:1}

/* Ahorro */
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{width:100%;max-width:1000px;min-width:560px;height:auto;display:block;margin:0 auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:700}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* Formalización */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.term{font-family:var(--mono);font-weight:700;font-size:1.3rem;padding:6px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.step{display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:.8rem;padding:0 4px}
.step .s{color:var(--suma)} .step .m{color:var(--mult)}
.step .s.off,.step .m.off{opacity:.35;text-decoration:line-through}
.formula{font-family:var(--mono);font-size:clamp(1.2rem,2.6vw,1.7rem);font-weight:700;padding:12px 16px;border-radius:10px;background:var(--paper);border:1px solid var(--line);overflow-x:auto}
.cover{cursor:pointer;background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 8px,var(--card) 8px,var(--card) 16px);color:transparent;user-select:none}
.cover::after{content:"Toca para revelar";color:var(--accent);font-size:.8rem;font-weight:700}
.cover.open{background:transparent;color:inherit;cursor:default}
.cover.open::after{content:none}
.compare td,.compare th{text-align:left}
.compare th:nth-child(2){color:var(--suma)} .compare th:nth-child(3){color:var(--mult)}

/* Retos */
.retos-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:18px}
@media (max-width:900px){.retos-layout{grid-template-columns:1fr}}
.reto-nav{display:flex;gap:6px;flex-wrap:wrap}
.reto-nav button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;cursor:pointer;font-family:var(--mono)}
.reto-nav button[aria-current="true"]{background:var(--ink);color:var(--card)}
.reto-q{font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:700;line-height:1.35}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1.1rem}
.option b{font-family:var(--mono);background:var(--paper);border-radius:8px;padding:0 8px;flex:none}
.option:hover{border-color:var(--ink-2)}
.option.correct{border-color:var(--ok);background:var(--ok-soft)}
.option.wrong{border-color:var(--bad);background:var(--bad-soft)}
.team-pick{display:flex;gap:8px;flex-wrap:wrap}
.team-pick button{border:2px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card);font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.team-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.matrix td,.matrix th{padding:6px;font-size:.85rem}
.matrix td.ok{background:var(--ok-soft);color:var(--ok);font-weight:800}
.pts{font-family:var(--mono);font-size:.85rem;color:var(--ink-2)}

/* Cierre */
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card);font-size:1.15rem}
.qitem.hidden-q{color:transparent;background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 8px,var(--card) 8px,var(--card) 16px);cursor:pointer;position:relative}
.qitem.hidden-q::after{content:"Toca para mostrar la pregunta";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:.95rem}
.ranking{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ranking li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-size:1.15rem}
.ranking li:first-child{border:2px solid var(--ok);background:var(--ok-soft)}
.ranking .pos{font-family:var(--display);font-weight:800;font-size:1.5rem}

/* Panel de equipos */
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:20px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.team-edit{display:grid;grid-template-columns:14px 1fr auto auto auto;gap:8px;align-items:center}
.team-edit input{width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){body{font-size:16px}.bar{grid-template-columns:70px 1fr}}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:18px}
.board-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#board{width:100%;max-width:calc(70vh * 760 / 460);min-width:560px;height:auto;display:block;margin:0 auto;touch-action:none;user-select:none}
#board .pz{transition:transform .9s cubic-bezier(.3,.7,.2,1),opacity .6s}
#board .pz .rot{transition:transform .9s cubic-bezier(.3,.7,.2,1)}
#board.play .pz,#board.play .pz .rot{transition-duration:.25s}
#board.play .pz{cursor:grab}
#board .pz.dragging,#board .pz.dragging .rot,#pieces.instant .pz,#pieces.instant .rot{transition:none}
#board .pz.dragging{cursor:grabbing}
#board .pulse{animation:blink 1s steps(2) infinite}
.say{font-size:1.25rem;line-height:1.45;min-height:5.2em}
.expr{font-family:var(--mono);font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:700;padding:12px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line);overflow-x:auto}
.expr i{font-style:normal;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 4px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.stat{font-size:.95rem;color:var(--ink-2)}
.stat b{font-family:var(--mono);font-size:1.3rem;color:var(--ink);margin-right:4px}
.top .seg{margin-left:auto}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><small>Taller de Álgebra · 3.º · Sesión 4</small><b>Rompecabezas de áreas</b></div>
    <div class="seg" role="group" aria-label="Modo">
      <button aria-pressed="true" data-mode="anim">▶ Animación</button>
      <button aria-pressed="false" data-mode="puzzle">🧩 Rompecabezas</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema claro u oscuro">◐</button>
    <button class="icon-btn" id="fsBtn" aria-label="Pantalla completa">⛶</button>
  </div>
  <nav class="tabs" aria-label="Figura">
    <a href="#suma" data-fig="suma">Binomio al cuadrado (a + b)²</a>
    <a href="#resta" data-fig="resta">Binomio al cuadrado (a − b)²</a>
    <a href="#dif" data-fig="dif">Diferencia de cuadrados a² − b²</a>
  </nav>
</header>
<main>
  <div class="view">
    <div class="stage">
      <div class="card board-card">
        <div class="board-wrap"><svg id="board" viewBox="0 0 760 460" role="img" aria-label="Tablero del rompecabezas"><g id="static"></g><g id="pieces"></g><g id="over"></g></svg></div>
        <div class="row" id="animBar">
          <button class="btn primary" id="play">▶ Reproducir</button>
          <button class="btn" id="prev">◀ Paso</button>
          <button class="btn" id="next">Paso ▶</button>
          <button class="btn ghost" id="restart">↺ Desde el inicio</button>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>
        <div class="row" id="puzBar" hidden>
          <button class="btn" id="rot">⟳ Girar pieza</button>
          <button class="btn ghost" id="hint">Pista</button>
          <button class="btn ghost" id="solve">Ver solución</button>
          <button class="btn primary" id="shuffle">Nuevo rompecabezas</button>
          <span class="stat"><b id="time">0:00</b> tiempo</span><span class="stat"><b id="moves">0</b> movimientos</span>
        </div>
      </div>
      <div class="side">
        <div class="card">
          <p class="eyebrow" id="figEyebrow"></p>
          <p class="say" id="say"></p>
          <p class="expr" id="expr"></p>
          <div class="table-wrap" id="numWrap"><table id="num"></table></div>
        </div>
        <div class="card">
          <label class="slider">a = <span class="v" id="aV">6</span><input type="range" id="aS" min="3" max="7" step="0.5" value="6"></label>
          <label class="slider">b = <span class="v" id="bV">2,5</span><input type="range" id="bS" min="1" max="3.5" step="0.5" value="2.5"></label>
          <label class="row small"><input type="checkbox" id="showNum"> Mostrar el área de cada pieza</label>
          <p class="muted small" id="help">En el rompecabezas: arrastren las piezas, tóquenlas dos veces para girarlas. Al acercarse a su lugar, encajan solas.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=(x,d=0)=>{const neg=x<0;let s=Math.abs(x).toFixed(d);let[i,f]=s.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return(neg?'−':'')+i+(f?','+f:'')};
const nf=v=>{const r=Math.round(v*100)/100;return fmt(r,Math.abs(r-Math.round(r))<1e-9?0:(Math.abs(r*10-Math.round(r*10))<1e-9?1:2))};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const NS='http://www.w3.org/2000/svg',K=32,BW=760/K,BH=460/K,OX=0.6,OY=1.6;
const C={a2:'var(--suma-soft)',ab:'color-mix(in srgb, var(--stick) 34%, var(--card))',b2:'var(--mult-soft)'};

/* ---------- modo animación ---------- */

function svgPt(e){const sv=$('#board'),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse());return{x:q.x/K,y:q.y/K}}

    const now=Date.now();if(sel===p.id&&now-lastTap<350){rotSel();return}lastTap=now;sel=p.id;if(!t0){t0=Date.now();tInt=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);$('#time').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500)}
    const q=svgPt(e);drag={p,dx:q.x-p.x,dy:q.y-p.y};$('#pieces').appendChild(p.el);p.el.classList.add('dragging');paintPieces();sv.setPointerCapture(e.pointerId);e.preventDefault()});
  sv.addEventListener('pointermove',e=>{if(!drag)return;const q=svgPt(e);drag.p.x=q.x-drag.dx;drag.p.y=q.y-drag.dy;const[w,h]=bb(drag.p);drag.p.el.style.transform=`translate(${(drag.p.x+w/2)*K}px,${(drag.p.y+h/2)*K}px)`});
  const end=()=>{if(!drag)return;drag.p.el.classList.remove('dragging');snap(drag.p);moves++;$('#moves').textContent=moves;drag=null;check()};sv.addEventListener('pointerup',end);sv.addEventListener('pointercancel',end)})();
$('#rot').onclick=rotSel;
$('#solve').onclick=()=>{helped=true;const D=defs();PZ.forEach(p=>place(p,D.goal[p.id]));check()};
$('#hint').onclick=()=>{const D=defs();const o=$('#over');let s='';PZ.forEach(p=>{const g=D.goal[p.id];const w=g[2]%180?p.h:p.w,h=g[2]%180?p.w:p.h;s+=`<rect x="${g[0]*K}" y="${g[1]*K}" width="${w*K}" height="${h*K}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="3 4"/><text x="${(g[0]+w/2)*K}" y="${(g[1]+h/2)*K+6}" text-anchor="middle" font-size="16" fill="var(--accent)" font-weight="700">${p.lab}</text>`});o.innerHTML=s;setTimeout(()=>{paintStatic()},2200)};
$('#shuffle').onclick=setupPuzzle;
/* ---------- controles ---------- */
function setup(){a=+$('#aS').value;b=+$('#bS').value;if(b>=a){b=a-0.5;$('#bS').value=b}$('#aV').textContent=nf(a);$('#bV').textContent=nf(b);
  $('#figEyebrow').textContent=NAMES[fig];$$('[data-fig]').forEach(x=>x.dataset.fig===fig?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));
  $('#animBar').hidden=mode!=='anim';$('#puzBar').hidden=mode!=='puzzle';$('#board').classList.toggle('play',mode==='puzzle');
  mode==='anim'?setupAnim():setupPuzzle()}
function route(){const h=location.hash.slice(1);fig=['suma','resta','dif'].includes(h)?h:'suma';setup()}
window.addEventListener('hashchange',route);
$$('[data-mode]').forEach(bt=>bt.onclick=()=>{mode=bt.dataset.mode;$$('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===bt));setup()});
$('#aS').oninput=setup;$('#bS').oninput=setup;$('#showNum').onchange=paintPieces;
$('#fsBtn').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}};
$('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('s1p-theme',r.dataset.theme)};
{const th=store.get('s1p-theme',null);if(th)document.documentElement.dataset.theme=th}
document.addEventListener('keydown',e=>{if(mode!=='anim'||e.target.matches('input'))return;if(e.key==='ArrowRight'){stopPlay();applyStep(step+1)}if(e.key==='ArrowLeft'){stopPlay();applyStep(step-1)}if(e.key===' '){e.preventDefault();$('#play').click()}});
route();
})();
</script>
